name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - "main"

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: HimeshDua
          template: classic
          base: header

          config_timezone: Asia/Karachi

          plugin_languages: no
          plugin_activity: no
          plugin_community: no
          plugin_habits: no
          plugin_isocalendar: no
          plugin_people: no
          plugin_stars: no
          plugin_topics: no
          plugin_followup: no
          plugin_repositories: no
