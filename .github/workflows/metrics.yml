name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - "main"

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    environment:
      name: production

    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: HimeshDua
          template: classic
          base: header, repositories

          config_timezone: Asia/Karachi

          plugin_languages: yes
          plugin_languages_limit: 4
